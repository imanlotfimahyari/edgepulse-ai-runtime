minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^charts/.*/templates/.*\.ya?ml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: disable}}"]
        exclude: ^charts/.*/templates/.*\.ya?ml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 3.2.495
    hooks:
      - id: checkov
        args:
          - --quiet
          - --skip-check
          - CKV_SECRET_6

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: pip-audit runtime requirements
        args: ["-r", "runtime/requirements.txt"]
        pass_filenames: false
      - id: pip-audit
        name: pip-audit simulator requirements
        args: ["-r", "simulators/requirements.txt"]
        pass_filenames: false

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.530
    hooks:
      - id: checkov
        name: checkov Helm chart
        args:
          - --directory
          - charts/edgepulse-runtime
          - --framework
          - helm
          - --soft-fail
          - --quiet
        pass_filenames: false
      - id: checkov
        name: checkov Dockerfile
        args:
          - --file
          - runtime/Dockerfile
          - --framework
          - dockerfile
          - --soft-fail
          - --quiet
        pass_filenames: false
