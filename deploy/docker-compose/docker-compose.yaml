services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: edgepulse-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  edgepulse-runtime:
    build:
      context: ../../runtime
      dockerfile: Dockerfile
    container_name: edgepulse-runtime
    environment:
      SERVICE_NAME: edgepulse-ai-runtime
      MODEL_NAME: edgepulse-anomaly-detector
      MODEL_VERSION: ${MODEL_VERSION:-0.3.0}
      MODEL_BACKEND: ${MODEL_BACKEND:-rule-based}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-0.65}
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC: edge/devices/+/telemetry
    ports:
      - "8080:8080"
    depends_on:
      - mqtt
