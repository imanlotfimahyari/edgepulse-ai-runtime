name: Release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Manual image tag to publish"
        required: false
        default: "manual"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/imanlotfimahyari/edgepulse-runtime

jobs:
  build-and-push:
    name: Build, push, and sign runtime image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract image metadata for version tag
        id: meta_tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Extract image metadata for manual run
        id: meta_manual
        if: github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag }}

      - name: Build and push image from version tag
        id: build_tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ./runtime
          file: ./runtime/Dockerfile
          push: true
          tags: ${{ steps.meta_tag.outputs.tags }}
          labels: ${{ steps.meta_tag.outputs.labels }}

      - name: Sign image from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build_tag.outputs.digest }}
          TAGS: ${{ steps.meta_tag.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Build and push image from manual run
        id: build_manual
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./runtime
          file: ./runtime/Dockerfile
          push: true
          tags: ${{ steps.meta_manual.outputs.tags }}
          labels: ${{ steps.meta_manual.outputs.labels }}

      - name: Sign image from manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build_manual.outputs.digest }}
          TAGS: ${{ steps.meta_manual.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
