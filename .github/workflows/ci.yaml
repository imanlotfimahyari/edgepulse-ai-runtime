name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            runtime/requirements-test.txt
            runtime/requirements.txt
            simulators/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r runtime/requirements-test.txt
          python -m pip install -r simulators/requirements.txt
          python -m pip install ruff==0.16.5

      - name: Compile Python files
        run: |
          python -m compileall runtime simulators

      - name: Ruff check
        run: |
          ruff check runtime simulators

      - name: Ruff format check
        run: |
          ruff format --check runtime simulators

      - name: Run runtime tests
        run: |
          PYTHONPATH=runtime pytest runtime/tests -v \
            --cov=runtime/app \
            --cov-report=term-missing

  helm:
    name: Helm checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Lint Helm chart
        run: |
          helm lint charts/edgepulse-runtime

      - name: Render Helm templates
        run: |
          helm template edgepulse-runtime charts/edgepulse-runtime > /tmp/edgepulse-rendered.yaml
          test -s /tmp/edgepulse-rendered.yaml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        run: |
          docker build -t edgepulse-runtime:ci ./runtime

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Audit runtime requirements
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: runtime/requirements.txt

      - name: Audit simulator requirements
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: simulators/requirements.txt

  iac-security:
    name: IaC security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Scan Helm chart
        run: |
          checkov -d charts/edgepulse-runtime --framework helm --skip-check CKV_K8S_21,CKV_K8S_15,CKV_K8S_43 --soft-fail --quiet

      - name: Scan Dockerfile
        run: |
          checkov -f runtime/Dockerfile --framework dockerfile --soft-fail --quiet

  compose-e2e:
    name: Compose E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start secured Compose stack
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yaml \
            --profile e2e \
            up -d --build mqtt edgepulse-runtime

      - name: Run Compose E2E test
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yaml \
            --profile e2e \
            run --rm --no-deps --build e2e

      - name: Show Compose logs
        if: always()
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yaml \
            --profile e2e \
            logs --no-color

      - name: Stop Compose stack
        if: always()
        run: |
          docker compose \
            -f deploy/docker-compose/docker-compose.yaml \
            --profile e2e \
            down -v --remove-orphans
