name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            runtime/requirements.txt
            simulators/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r runtime/requirements.txt
          python -m pip install -r simulators/requirements.txt
          python -m pip install ruff

      - name: Compile Python files
        run: |
          python -m compileall runtime simulators

      - name: Ruff check
        run: |
          ruff check runtime simulators

      - name: Ruff format check
        run: |
          ruff format --check runtime simulators

  helm:
    name: Helm checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Lint Helm chart
        run: |
          helm lint charts/edgepulse-runtime

      - name: Render Helm templates
        run: |
          helm template edgepulse-runtime charts/edgepulse-runtime > /tmp/edgepulse-rendered.yaml
          test -s /tmp/edgepulse-rendered.yaml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        run: |
          docker build -t edgepulse-runtime:ci ./runtime
