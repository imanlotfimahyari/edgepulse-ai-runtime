---
nameOverride: ""
fullnameOverride: ""

runtime:
  replicaCount: 1

  image:
    repository: docker-compose-edgepulse-runtime
    tag: "0.6.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  env:
    serviceName: edgepulse-ai-runtime
    modelName: edgepulse-anomaly-detector
    modelVersion: "0.3.0"
    modelBackend: rule-based
    modelPath: /app/models/anomaly_score.onnx
    anomalyThreshold: "0.65"
    mqttEnabled: "true"
    mqttTopic: edge/devices/+/telemetry

  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mqtt:
  enabled: true

  image:
    repository: eclipse-mosquitto
    tag: "2"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 1883

  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi


serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  metricRelabelings: []
  relabelings: []


networkPolicy:
  enabled: true
  annotations: {}
  ingress:
    enabled: true
  egress:
    enabled: false
