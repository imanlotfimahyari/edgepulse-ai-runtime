---
nameOverride: ""
fullnameOverride: ""

runtime:
  replicaCount: 1

  image:
    repository: ghcr.io/imanlotfimahyari/edgepulse-runtime
    tag: "0.9.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  env:
    serviceName: edgepulse-ai-runtime
    modelName: edgepulse-anomaly-detector
    modelVersion: "0.9.0"
    modelBackend: rule-based
    executionProfile: balanced
    modelPath: /app/models/anomaly_score.onnx
    anomalyThreshold: "0.65"
    mqttEnabled: "true"
    mqttTopic: edge/devices/+/telemetry

  mqtt:
    auth:
      enabled: false
      existingSecret: ""
      usernameKey: username
      passwordKey: password

    tls:
      enabled: false
      existingSecret: ""
      caKey: ca.crt

      clientCertificate:
        enabled: false
        certKey: tls.crt
        keyKey: tls.key

  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mqtt:
  enabled: true

  image:
    repository: eclipse-mosquitto
    tag: "2"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 1883

  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  auth:
    enabled: false
    existingSecret: ""
    passwordFileKey: passwords

  tls:
    enabled: false
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  metricRelabelings: []
  relabelings: []

networkPolicy:
  enabled: true
  annotations: {}
  ingress:
    enabled: true
  egress:
    enabled: false
