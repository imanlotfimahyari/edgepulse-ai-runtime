{{- if .Values.mqtt.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgepulse-runtime.mqttFullname" . }}
  labels:
    {{- include "edgepulse-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
spec:
  type: {{ .Values.mqtt.service.type }}
  ports:
    - name: mqtt
      port: {{ .Values.mqtt.service.port }}
      targetPort: mqtt
  selector:
    {{- include "edgepulse-runtime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
{{- end }}
