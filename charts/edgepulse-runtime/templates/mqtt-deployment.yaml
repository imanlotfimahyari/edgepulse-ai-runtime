{{- if .Values.mqtt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgepulse-runtime.mqttFullname" . }}
  labels:
    {{- include "edgepulse-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "edgepulse-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mqtt
  template:
    metadata:
      labels:
        {{- include "edgepulse-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mqtt
    spec:
      serviceAccountName: {{ include "edgepulse-runtime.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mqtt
          image: "{{ .Values.mqtt.image.repository }}:{{ .Values.mqtt.image.tag }}"
          imagePullPolicy: {{ .Values.mqtt.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.mqtt.securityContext | nindent 12 }}
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: mqtt-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mqtt-data
              mountPath: /mosquitto/data
            - name: mqtt-log
              mountPath: /mosquitto/log
          resources:
            {{- toYaml .Values.mqtt.resources | nindent 12 }}
      volumes:
        - name: mqtt-config
          configMap:
            name: {{ include "edgepulse-runtime.mqttFullname" . }}-config
        - name: mqtt-data
          emptyDir: {}
        - name: mqtt-log
          emptyDir: {}
{{- end }}
