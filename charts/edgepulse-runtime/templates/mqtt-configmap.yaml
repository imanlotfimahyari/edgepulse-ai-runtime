{{- if .Values.mqtt.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edgepulse-runtime.mqttFullname" . }}-config
  labels:
    {{- include "edgepulse-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
{{- end }}
