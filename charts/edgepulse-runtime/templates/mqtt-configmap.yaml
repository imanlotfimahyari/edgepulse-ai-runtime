{{- if .Values.mqtt.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edgepulse-runtime.mqttFullname" . }}-config
  labels:
    {{- include "edgepulse-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
data:
  mosquitto.conf: |
    listener {{ .Values.mqtt.service.port }} 0.0.0.0

    {{- if .Values.mqtt.auth.enabled }}
    allow_anonymous false
    password_file /mosquitto/security/passwords
    {{- else }}
    allow_anonymous true
    {{- end }}

    {{- if .Values.mqtt.tls.enabled }}
    certfile /mosquitto/tls/tls.crt
    keyfile /mosquitto/tls/tls.key
    tls_version tlsv1.2
    {{- end }}
{{- end }}
