{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edgepulse-runtime.fullname" . }}
  labels:
    {{- include "edgepulse-runtime.labels" . | nindent 4 }}
  {{- with .Values.networkPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "edgepulse-runtime.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.runtime.service.port }}
        {{- if .Values.mqtt.enabled }}
        - protocol: TCP
          port: {{ .Values.mqtt.service.port }}
        {{- end }}
{{- end }}
